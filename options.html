<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed Lens</title><link rel="icon" type="image/png" href="icons/icon-32.png"><link rel="stylesheet" href="options.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><img src="icons/icon-128.png" width="48" height="48" alt=""><strong>Feed Lens</strong></div><p class="nav-caption" data-i18n="platforms"></p><nav id="platform-nav" aria-label="Platforms"></nav><div class="sidebar-bottom"><button id="connection-open" class="connection-link"><span class="connection-dot" id="connection-dot"></span><span data-i18n="connection"></span></button><label for="language" data-i18n="language"></label><select id="language"></select><div class="sidebar-links"><a href="privacy.html" target="_blank" rel="noreferrer" data-i18n="privacy"></a><a href="https://github.com/SkywalkerDarren/feed-lens" target="_blank" rel="noreferrer" data-i18n="code"></a></div></div></aside>
<main><header class="workspace-header"><div><h1 data-i18n="workspace"></h1><p data-i18n="subtitle"></p></div><div class="workspace-actions"><button id="import" data-i18n="import"></button><button id="export" data-i18n="export"></button><button id="connection-status" class="quiet-button"></button></div></header>
<div class="platform-heading"><div><h2 id="platform-name"></h2><p data-i18n="independent"></p></div><label class="toggle-label"><input id="enabled" type="checkbox" role="switch"><span id="enabled-label"></span></label></div>
<div class="workbench"><section class="editor" aria-label="Label editor"><div class="editor-toolbar"><div class="group-tabs" role="tablist"><button id="topic-tab" role="tab" aria-controls="groups" data-group="topic" aria-selected="true"></button><button id="influence-tab" role="tab" aria-controls="groups" data-group="influence" aria-selected="false"></button></div><button id="add" class="add-button" data-i18n="add"></button></div><label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5.5"></circle><path d="m12 12 5 5"></path></svg><input id="search" type="search"></label><div class="column-headings"><span data-i18n="name"></span><span data-i18n="rule"></span></div><div id="groups" role="tabpanel" tabindex="0"></div><button id="restore" class="text-button" data-i18n="restore"></button></section>
</div>
<input id="import-file" type="file" accept=".json,application/json" hidden><footer class="savebar"><span id="status" role="status" aria-live="polite"></span><button id="save" class="primary"></button></footer></main></div>
<dialog id="connection-dialog"><div class="dialog-heading"><h2 data-i18n="connectTitle"></h2><button class="icon-button" id="connection-close" type="button">×</button></div><label for="key" data-i18n="keyLabel"></label><div class="keyrow"><input id="key" type="password" autocomplete="off" spellcheck="false"><button id="show" type="button" data-i18n="show"></button></div><p class="muted" data-i18n="keyStorage"></p><p id="connection-message" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="clear" class="text-button" data-i18n="clear"></button><button id="test" data-i18n="test"></button><button id="connection-save" class="primary" data-i18n="applyConnection"></button></div></dialog>
<dialog id="import-dialog"><div class="dialog-heading"><h2 data-i18n="importTitle"></h2><button id="import-close" class="icon-button">×</button></div><p data-i18n="importHelp"></p><div id="import-summary"></div><p class="muted" data-i18n="configHelp"></p><div class="dialog-actions"><button id="import-cancel" data-i18n="cancel"></button><button id="import-apply" class="primary" data-i18n="importApply"></button></div></dialog>
<script type="module" src="options.js"></script></body></html>
